name: Test, Build and Publish

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    tags:
      - "*"
      # Desktop app releases (desktop-v*, desktop-appcast) are not CLI releases.
      - "!desktop-*"

permissions:
  contents: write

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Install deps
        run: go install github.com/jstemmer/go-junit-report/v2@latest
      - name: Run tests
        run: go test -cover -bench=. -benchmem -race -v 2>&1 ./... | tee test.log | go-junit-report -set-exit-code > report.xml
      - name: Show failed test output
        if: failure()
        run: grep -n -B5 -A30 -E -- '--- FAIL|\[FAIL\]|panic:|^FAIL' test.log || cat test.log
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: |
            report.xml
        if: always()

  goreleaser:
    name: Build and Publish
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
