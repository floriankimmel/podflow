name: Auto-assign on column move
on:
  repository_dispatch:
    types: [projects_v2_item_edited]

jobs:
  assign-mover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const payload = context.payload.client_payload;
            const item = payload.projects_v2_item;
            const mover = payload.sender.login;

            if (item.content_type !== 'Issue') return;

            const query = `query($id: ID!) {
              node(id: $id) {
                ... on Issue {
                  number
                  repository { name owner { login } }
                }
              }
            }`;

            const result = await github.graphql(query, { id: item.content_node_id });
            const issue = result.node;

            await github.rest.issues.addAssignees({
              owner: issue.repository.owner.login,
              repo: issue.repository.name,
              issue_number: issue.number,
              assignees: [mover]
            });

            console.log(`Assigned ${mover} to issue #${issue.number}`);
